version: '3.8'

services:
  # FastAPI backend only. Run the React app from the repo Frontend/ separately.
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: text-processor-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - VITE_APP_URL=${VITE_APP_URL}
    volumes:
      - ./utils:/app/utils
      - ./api_server:/app/api_server
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
