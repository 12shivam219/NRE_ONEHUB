services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TEXT_PROCESSOR_API_URL: ${VITE_TEXT_PROCESSOR_API_URL:-http://localhost:8000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_TEXT_PROCESSOR_API_KEY: ${VITE_TEXT_PROCESSOR_API_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
